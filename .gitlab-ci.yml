stages:
  - build
  - release

build:
  stage: build
  tags: [docker]
  image: mingc/android-build-box:latest
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GITLAB_SERVER_URL: "$CI_SERVER_URL"
    GITLAB_REPOSITORY: "$CI_PROJECT_PATH"
  script:
    - ./gradlew assembleRelease --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 4 weeks

release:
  stage: release
  tags: [docker]
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      curl --fail -s --upload-file app/build/outputs/apk/release/app-release.apk \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/excerpta-android/latest/excerpta-android.apk" \
        -H "JOB-TOKEN: $CI_JOB_TOKEN"
    - curl -s -X DELETE "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/latest" -H "PRIVATE-TOKEN: $GITLAB_TOKEN" || true
    - sleep 1
    - curl -s -X DELETE "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/latest" -H "PRIVATE-TOKEN: $GITLAB_TOKEN" || true
    - sleep 1
    - |
      curl -s -X POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
        -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"name\": \"Latest build\",
          \"tag_name\": \"latest\",
          \"description\": \"commit:$CI_COMMIT_SHORT_SHA\",
          \"ref\": \"$CI_COMMIT_SHA\",
          \"assets\": {
            \"links\": [{
              \"name\": \"excerpta-android.apk\",
              \"url\": \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/excerpta-android/latest/excerpta-android.apk\"
            }]
          }
        }"
  only: [main]
  needs:
    - job: build
      artifacts: true

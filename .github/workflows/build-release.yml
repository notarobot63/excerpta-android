name: Build & release APK

on:
  push:
    branches: [main]   # build de vérification, sans release
    tags: ['v*']       # build + release publiée

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : gitVersionCode = git rev-list --count HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK signée
        env:
          RELEASES_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
          APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/excerpta-android.apk
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk excerpta-android.apk

      # Hors tag, l'APK reste récupérable en artefact de run pour un test manuel,
      # mais n'est pas publié : une release correspond à une version décidée.
      - name: Publier l'APK en artefact (hors release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: excerpta-android-${{ github.sha }}
          path: excerpta-android.apk
          retention-days: 14

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # « commit: » est lu par UpdateChecker pour détecter une mise à jour.
          SHORT7=$(git rev-parse --short=7 HEAD)
          gh release create "$VERSION" excerpta-android.apk \
            --title "$VERSION" \
            --generate-notes \
            --notes "commit:${SHORT7}"

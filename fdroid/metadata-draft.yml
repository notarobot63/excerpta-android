# Ce fichier n'est PAS lu par les outils F-Droid depuis ce dépôt : c'est un brouillon
# à copier dans metadata/xyz.notarobot.excerpta.yml lors d'une future Merge Request
# vers https://gitlab.com/fdroid/fdroiddata (ou à joindre à une "Request For Packaging",
# voir fdroid/RFP-issue-draft.md).
#
# v1.1.2 (commit fb5e848) inclut le fix du 2026-08-01 qui rend le build possible
# sans secret ni keystore local : c'est le premier tag utilisable par F-Droid,
# qui construit sans aucun accès à nos secrets CI. Ne pas pointer sur v1.1.0/v1.1.1,
# antérieurs au fix (le build échouerait au moment de la signature).

